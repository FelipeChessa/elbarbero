<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | E.L Barbero Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --primary: #1a1a1a;
            --accent: #c9a96e;
            --accent-light: #dfc08a;
            --text: #ffffff;
            --text-muted: #a0a0a0;
            --bg-dark: #0d0d0d;
            --bg-card: #151515;
            --danger: #e74c3c;
            --font-display: 'Playfair Display', Georgia, serif;
            --font-body: 'Inter', -apple-system, sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: var(--font-body);
            background: var(--bg-dark);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-container { width: 100%; max-width: 450px; padding: 40px; }

        .login-card {
            background: var(--bg-card);
            border: 1px solid rgba(201, 169, 110, 0.2);
            padding: 50px 40px;
            text-align: center;
        }

        .login-logo .logo-text {
            font-family: var(--font-display);
            font-size: 2rem;
            font-weight: 700;
            color: var(--text);
        }

        .login-logo .logo-sub {
            font-size: 0.7rem;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: var(--accent);
            margin-top: 5px;
        }

        .login-title { font-family: var(--font-display); font-size: 1.5rem; margin-bottom: 10px; }
        .login-subtitle { color: var(--text-muted); font-size: 0.9rem; margin-bottom: 30px; }

        .form-group { margin-bottom: 20px; text-align: left; }
        .form-group label { display: block; font-size: 0.85rem; font-weight: 500; color: var(--text-muted); margin-bottom: 8px; }
        .form-group input {
            width: 100%;
            padding: 14px 16px;
            background: var(--bg-dark);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text);
            font-family: var(--font-body);
            font-size: 1rem;
        }
        .form-group input:focus { outline: none; border-color: var(--accent); }

        .btn-primary {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 16px;
            background: var(--accent);
            color: var(--primary);
            font-weight: 600;
            font-size: 1rem;
            border: none;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 20px;
        }
        .btn-primary:hover { background: var(--accent-light); }
        .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; }

        .divider { display: flex; align-items: center; gap: 15px; margin: 25px 0; color: var(--text-muted); font-size: 0.85rem; }
        .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: rgba(255, 255, 255, 0.1); }

        .btn-google {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            width: 100%;
            padding: 16px;
            background: #4285f4;
            color: white;
            font-weight: 600;
            font-size: 1rem;
            border: none;
            cursor: pointer;
        }
        .btn-google:hover { background: #357ae8; }

        .error-message {
            background: rgba(231, 76, 60, 0.1);
            border: 1px solid var(--danger);
            color: var(--danger);
            padding: 12px 16px;
            font-size: 0.9rem;
            margin-bottom: 20px;
            display: none;
        }
        .error-message.show { display: block; }

        .back-link { margin-top: 30px; color: var(--text-muted); font-size: 0.9rem; }
        .back-link a { color: var(--accent); text-decoration: none; }

        .register-link { margin-top: 20px; color: var(--text-muted); font-size: 0.9rem; }
        .register-link a { color: var(--accent); text-decoration: none; cursor: pointer; }

        .signup-form { display: none; }
        .signup-form.show { display: block; }
        .login-form.hidden { display: none; }

        .loading { width: 20px; height: 20px; border: 2px solid var(--primary); border-top-color: transparent; border-radius: 50%; animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="login-logo">
                <div class="logo-text">E.L Barbero</div>
                <div class="logo-sub">Admin</div>
            </div>

            <h1 class="login-title" id="formTitle">Entrar</h1>
            <p class="login-subtitle" id="formSubtitle">Acesse o painel administrativo</p>

            <div class="error-message" id="errorMessage"></div>

            <form class="login-form" id="loginForm">
                <div class="form-group">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" name="email" required placeholder="seu@email.com">
                </div>
                <div class="form-group">
                    <label for="password">Senha</label>
                    <input type="password" id="password" name="password" required placeholder="••••••••">
                </div>
                <button type="submit" class="btn-primary" id="loginBtn">
                    <span>Entrar</span>
                </button>
            </form>

            <form class="signup-form" id="signupForm">
                <div class="form-group">
                    <label for="signupEmail">E-mail</label>
                    <input type="email" id="signupEmail" name="email" required placeholder="seu@email.com">
                </div>
                <div class="form-group">
                    <label for="signupPassword">Senha</label>
                    <input type="password" id="signupPassword" name="password" required placeholder="Mínimo 6 caracteres" minlength="6">
                </div>
                <div class="form-group">
                    <label for="confirmPassword">Confirmar Senha</label>
                    <input type="password" id="confirmPassword" name="confirmPassword" required placeholder="••••••••">
                </div>
                <button type="submit" class="btn-primary" id="signupBtn">
                    <span>Criar Conta</span>
                </button>
            </form>

            <div class="divider">ou</div>

            <button class="btn-google" id="googleBtn">
                <i class="fab fa-google"></i>
                <span>Continuar com Google</span>
            </button>

            <p class="register-link" id="registerLink">
                Não tem conta? <a id="showSignup">Criar conta</a>
            </p>
            <p class="register-link" id="loginLink" style="display: none;">
                Já tem conta? <a id="showLogin">Entrar</a>
            </p>

            <p class="back-link">
                <a href="index.html">← Voltar para o site</a>
            </p>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://ijwuaztnzrptdoonoglq.supabase.co'
        const SUPABASE_KEY = 'sb_publishable_cagM3vIdKiqcNWo36AHSXg_54A9fTLX'

        function showError(msg) {
            document.getElementById('errorMessage').textContent = msg
            document.getElementById('errorMessage').classList.add('show')
        }

        function hideError() {
            document.getElementById('errorMessage').classList.remove('show')
        }

        function setLoading(btn, loading) {
            btn.disabled = loading
            btn.innerHTML = loading ? '<div class="loading"></div>' : (btn.id === 'loginBtn' ? '<span>Entrar</span>' : '<span>Criar Conta</span>')
        }

        // Toggle forms
        document.getElementById('showSignup').onclick = () => {
            document.getElementById('loginForm').classList.add('hidden')
            document.getElementById('signupForm').classList.add('show')
            document.getElementById('formTitle').textContent = 'Criar Conta'
            document.getElementById('formSubtitle').textContent = 'Cadastre-se para acessar'
            document.getElementById('registerLink').style.display = 'none'
            document.getElementById('loginLink').style.display = 'block'
            hideError()
        }

        document.getElementById('showLogin').onclick = () => {
            document.getElementById('signupForm').classList.remove('show')
            document.getElementById('loginForm').classList.remove('hidden')
            document.getElementById('formTitle').textContent = 'Entrar'
            document.getElementById('formSubtitle').textContent = 'Acesse o painel administrativo'
            document.getElementById('registerLink').style.display = 'block'
            document.getElementById('loginLink').style.display = 'none'
            hideError()
        }

        // Check if already logged in
        if (localStorage.getItem('supabase_token')) {
            window.location.href = 'adm.html'
        }

        // Login
        document.getElementById('loginForm').onsubmit = async (e) => {
            e.preventDefault()
            hideError()
            const btn = document.getElementById('loginBtn')
            const email = document.getElementById('email').value
            const password = document.getElementById('password').value

            setLoading(btn, true)

            try {
                const response = await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=password`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'apikey': SUPABASE_KEY },
                    body: JSON.stringify({ email, password })
                })

                const data = await response.json()
                console.log('Login response:', data)

                if (data.access_token) {
                    localStorage.setItem('supabase_token', data.access_token)
                    localStorage.setItem('supabase_user', JSON.stringify(data.user))
                    window.location.href = 'adm.html'
                } else {
                    showError(data.error_description || 'E-mail ou senha incorretos')
                }
            } catch (err) {
                showError('Erro de conexão: ' + err.message)
            }

            setLoading(btn, false)
        }

        // Signup
        document.getElementById('signupForm').onsubmit = async (e) => {
            e.preventDefault()
            hideError()

            const email = document.getElementById('signupEmail').value
            const password = document.getElementById('signupPassword').value
            const confirmPassword = document.getElementById('confirmPassword').value
            const btn = document.getElementById('signupBtn')

            if (password !== confirmPassword) {
                showError('As senhas não coincidem')
                return
            }

            if (password.length < 6) {
                showError('A senha deve ter pelo menos 6 caracteres')
                return
            }

            setLoading(btn, true)

            try {
                const response = await fetch(`${SUPABASE_URL}/auth/v1/signup`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'apikey': SUPABASE_KEY },
                    body: JSON.stringify({ email, password })
                })

                const data = await response.json()
                console.log('Signup response:', data)

                if (response.ok) {
                    alert('Conta criada! Verifique seu e-mail para confirmar.')
                    document.getElementById('showLogin').click()
                } else {
                    showError(data.msg || 'Erro ao criar conta')
                }
            } catch (err) {
                showError('Erro: ' + err.message)
            }

            setLoading(btn, false)
        }

        // Google Login
        document.getElementById('googleBtn').onclick = () => {
            const redirectUrl = encodeURIComponent(window.location.origin + '/adm.html')
            window.location.href = `${SUPABASE_URL}/auth/v1/authorize?provider=google&redirect_to=${redirectUrl}`
        }
    </script>
</body>
</html>
